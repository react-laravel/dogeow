name: Conventional Branch

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  conventional-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Checking branch name: $BRANCH_NAME"

          ALLOWED_PATTERNS="^(main|develop|feature/|bugfix/|hotfix/|release/|chore/|ai|refactor/|fix/|cursor/)"

          if [[ "$BRANCH_NAME" =~ $ALLOWED_PATTERNS ]]; then
            echo "Branch name '$BRANCH_NAME' is valid."
            exit 0
          else
            echo "Branch name '$BRANCH_NAME' does not match allowed patterns."
            echo "Allowed patterns: main, develop, feature/*, bugfix/*, hotfix/*, release/*, chore/*, ai*, refactor/*, fix/*, cursor/*"
            exit 1
          fi
