name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build outputs
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-next-build-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'next.config.*', 'tsconfig*.json', 'postcss.config.*') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-next-build-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'next.config.*', 'tsconfig*.json', 'postcss.config.*') }}-

      - name: Run type check
        run: npm run type-check

      - name: Run linting
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check
        continue-on-error: true

      - name: Build application
        run: npm run build

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci -- --coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  bundle-analyze:
    needs: [lint-and-test]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js analysis outputs
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-next-analyze-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'next.config.*', 'tsconfig*.json', 'postcss.config.*') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-next-analyze-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'next.config.*', 'tsconfig*.json', 'postcss.config.*') }}-

      - name: Build with analyzer enabled
        run: npm run analyze -- --output
        continue-on-error: true
        env:
          CI: true

      - name: Upload bundle analysis report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analyzer-report
          path: .next/diagnostics/analyze
          retention-days: 30
