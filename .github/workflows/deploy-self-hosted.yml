name: Deploy Next frontend to C

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build and verify C without replacing its current Next release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-dogeow-next-c
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 40
    env:
      HOME: /var/www
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=1536
      DOGEOW_CI_BUILD_ENV_FILE: /var/lib/main-sites-ci/dogeow-next.env
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install locked build dependencies
        run: npm ci
      - name: Load public build settings
        run: |
          set -euo pipefail
          test -r "$DOGEOW_CI_BUILD_ENV_FILE"
          if grep -qEv '^(#|[[:space:]]*$|NEXT_PUBLIC_[A-Za-z0-9_]+=)' "$DOGEOW_CI_BUILD_ENV_FILE"; then
            echo 'CI build environment must contain only NEXT_PUBLIC_ assignments' >&2
            exit 1
          fi
          cp "$DOGEOW_CI_BUILD_ENV_FILE" .env.production.local
          chmod 600 .env.production.local
      - name: Build and package minimal runtime
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          npm run build
          node scripts/package-runtime.mjs
          du -sh .deploy-runtime
      - name: Validate or publish C
        env:
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only }}
          C_DEPLOY_SSH_KEY: ${{ secrets.C_DEPLOY_SSH_KEY }}
          C_DEPLOY_KNOWN_HOSTS: ${{ secrets.C_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ "$VALIDATE_ONLY" = true ]; then
            bash scripts/deploy-to-c.sh --check-only
          else
            bash scripts/deploy-to-c.sh
          fi
      - name: Remove temporary environment and upload bundle
        if: always()
        run: rm -rf .deploy-runtime .env.production.local
