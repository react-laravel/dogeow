# Include this file from the next.dogeow.com server block (or from http {}).
# Next already compresses proxied HTML; these directives also compress the
# /_next/static files that Nginx serves directly from disk.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
  application/javascript
  application/json
  application/manifest+json
  application/wasm
  application/xml
  image/svg+xml
  text/css
  text/javascript
  text/plain
  text/xml;
